name: Aikido Release Gated Scan

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  aikido-scan:
    runs-on: ubuntu-latest
    env:
      AIKIDO_CLIENT_API_KEY: ${{ secrets.AIKIDO_CLIENT_API_KEY }}
    steps:
      - name: Skip when Aikido is not configured
        if: ${{ env.AIKIDO_CLIENT_API_KEY == '' }}
        run: echo "AIKIDO_CLIENT_API_KEY is not set; skipping scan."

      - name: Set up Node.js
        if: ${{ env.AIKIDO_CLIENT_API_KEY != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Aikido CI API Client
        if: ${{ env.AIKIDO_CLIENT_API_KEY != '' }}
        run: npm install --global @aikidosec/ci-api-client

      - name: Run Aikido scan
        if: ${{ env.AIKIDO_CLIENT_API_KEY != '' }}
        run: >
          aikido-api-client scan-release
          "${{ github.event.repository.name }}"
          "$GITHUB_SHA"
          --apikey "$AIKIDO_CLIENT_API_KEY"
          --fail-on-sast-scan
          --fail-on-iac-scan
          --fail-on-secrets-scan
